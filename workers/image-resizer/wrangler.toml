name = "image-resizer"
main = "src/index.ts"
compatibility_date = "2024-02-08"

# Bind to the R2 bucket containing the assets
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "miroirspolaires-assets"

# Optional: Add KV namespace or other bindings if needed later

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

