name: CI

# Vérifications de chaque push et pull request vers dev et main :
# format, lint, types, tests avec seuils de couverture, puis build.
# Lancement manuel possible depuis l'onglet Actions (« Run workflow »), sur n'importe quelle branche.
# Secrets optionnels (Settings > Secrets and variables > Actions) : TURSO_DATABASE_URL, TURSO_AUTH_TOKEN.
# POURQUOI : le build prérend des routes qui lisent Turso ; sans ces secrets, l'étape est sautée
# avec un avertissement plutôt que d'échouer.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests with coverage thresholds
        run: npx vitest run --coverage

      - name: Build
        if: env.TURSO_DATABASE_URL != ''
        run: npm run build

      - name: Build skipped
        if: env.TURSO_DATABASE_URL == ''
        run: echo "::warning title=Build sauté::Secrets TURSO_DATABASE_URL / TURSO_AUTH_TOKEN absents, le build n'a pas été vérifié."
