name: Update Exoplanets Database

on:
  workflow_dispatch: # Lancement manuel depuis l'onglet Actions de GitHub

# Le script écrit directement dans Turso : aucun fichier du dépôt n'est modifié ni commité.
# Secrets requis (Settings > Secrets and variables > Actions) : TURSO_DATABASE_URL, TURSO_AUTH_TOKEN.

# POURQUOI : deux imports simultanés écriraient en même temps dans la même table Turso.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run

      - name: Run exoplanets update pipeline
        run: npm run update-exoplanets
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
